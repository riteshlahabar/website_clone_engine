pages:
  - title: Home
    slug: home
    isFrontPage: true
    sections:
      - block: hero-centered
        content:
          heading: Gentle dentistry, honest advice
          subheading: A calm clinic in Pune for people who would rather be anywhere else.
          buttonText: Book an appointment
          buttonUrl: /brightsmile/contact/
      - block: features-3col
        content:
          heading: What we do
          feature1Title: Preventive care
          feature1Text: Check-ups and cleaning that keep problems small.
          feature2Title: Cosmetic work
          feature2Text: Whitening, veneers and alignment done conservatively.
          feature3Title: Emergency help
          feature3Text: Same-day appointments when something goes wrong.
