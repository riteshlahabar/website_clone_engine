          feature1Title: Scaling
          feature1Text: Removes plaque the brush cannot reach.
          feature2Title: Fillings
          feature2Text: Tooth-coloured composite, matched to your enamel.
          feature3Title: Root canal
          feature3Text: Done under local anaesthetic in one or two sittings.
